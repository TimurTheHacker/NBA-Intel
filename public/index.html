<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA Intel</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #08080e;
  --surface: #0f0f18;
  --surface2: #161620;
  --border: #1f1f30;
  --border2: #2a2a3f;
  --accent: #f5a623;
  --accent-dim: rgba(245,166,35,0.12);
  --red: #e8504a;
  --green: #4ecb71;
  --purple: #a78bfa;
  --text: #ddddf0;
  --muted: #5c5c7a;
  --muted2: #8888a8;
  --r: 12px;
}

body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 70% 40% at 15% 0%, rgba(245,166,35,0.06) 0%, transparent 55%),
    radial-gradient(ellipse 50% 35% at 85% 100%, rgba(232,80,74,0.05) 0%, transparent 55%);
  pointer-events: none; z-index: 0;
}

.wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

/* ── Header ── */
header {
  padding: 44px 0 28px; border-bottom: 1px solid var(--border);
  margin-bottom: 36px; display: flex; align-items: center; gap: 16px;
}
.logo-mark { width: 46px; height: 46px; background: var(--accent); border-radius: 10px; display: grid; place-items: center; font-size: 24px; flex-shrink: 0; }
.logo-text h1 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 3px; line-height: 1; }
.logo-text h1 em { color: var(--accent); font-style: normal; }
.logo-text p { font-size: 12px; color: var(--muted2); margin-top: 3px; }

/* ── Controls ── */
.controls { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 24px; margin-bottom: 28px; }
.controls-title { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 16px; }
.controls-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.field { flex: 1; min-width: 130px; }

label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }

input[type="date"] {
  width: 100%; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 8px; padding: 9px 13px; color: var(--text);
  font-family: 'DM Mono', monospace; font-size: 13px;
  outline: none; transition: border-color 0.2s; color-scheme: dark;
}
input[type="date"]:focus { border-color: var(--accent); }

.seg-toggle { display: flex; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; overflow: hidden; height: 38px; align-self: flex-end; }
.seg-tab { padding: 0 14px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--muted); border: none; background: transparent; font-family: 'DM Sans', sans-serif; transition: all 0.15s; display: flex; align-items: center; white-space: nowrap; }
.seg-tab.active { background: var(--accent); color: #000; }

.btn { height: 38px; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.18s; padding: 0 18px; white-space: nowrap; }
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
.btn-ghost { background: transparent; color: var(--muted2); border: 1px solid var(--border2); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

/* ── Section label ── */
.section-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── Game Cards ── */
.games-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 32px; }

.game-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 20px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.18s; position: relative; overflow: hidden; }
.game-card::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--border2); transition: background 0.2s; }
.game-card:hover { border-color: rgba(245,166,35,0.35); }
.game-card:hover::after { background: var(--accent); }
.game-card.active { border-color: var(--accent); background: var(--accent-dim); }
.game-card.active::after { background: var(--accent); }

.teams { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.team { flex: 1; overflow: hidden; }
.team-abbr { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team-seed {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  font-family: 'DM Mono', monospace;
  color: var(--purple);
  background: rgba(167,139,250,0.12);
  border-radius: 3px;
  padding: 1px 5px;
  margin-top: 3px;
  letter-spacing: 0.5px;
}
.team.home { text-align: right; }

.scoreboard { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1px; color: var(--accent); display: flex; align-items: center; gap: 6px; min-width: 70px; justify-content: center; flex-shrink: 0; }
.score-dot { color: var(--border2); font-size: 16px; }

.game-info { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.badges { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

.badge { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; }
.badge-final  { background: rgba(92,92,122,0.25); color: var(--muted2); }
.badge-live   { background: rgba(78,203,113,0.15); color: var(--green); letter-spacing: 0.3px; font-size: 10px; }
.badge-soon   { background: rgba(245,166,35,0.15); color: var(--accent); }
.badge-playoff { background: rgba(167,139,250,0.15); color: var(--purple); font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: 0.3px; }
.badge-round  { background: rgba(167,139,250,0.08); color: var(--purple); font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; opacity: 0.85; }

.game-date-label { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }

.analyze-btn { background: var(--surface2); border: 1px solid var(--border2); color: var(--muted2); border-radius: 7px; padding: 5px 12px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; flex-shrink: 0; }
.analyze-btn:hover, .game-card.active .analyze-btn { background: var(--accent); color: #000; border-color: var(--accent); }

/* ── Analysis Panel ── */
.analysis-panel { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--r); padding: 28px 28px 32px; margin-bottom: 40px; display: none; animation: appear 0.25s ease; }
.analysis-panel.show { display: block; }

@keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.analysis-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
.analysis-head-left h2 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; color: var(--accent); line-height: 1.1; }
.analysis-head-left p { font-size: 12px; color: var(--muted2); margin-top: 3px; font-family: 'DM Mono', monospace; }

.score-summary { display: flex; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
.score-chip { background: var(--surface2); border-radius: 8px; padding: 12px 18px; text-align: center; flex: 1; min-width: 80px; }
.score-chip .val { font-family: 'Bebas Neue', sans-serif; font-size: 30px; color: var(--accent); line-height: 1; }
.score-chip .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }
.score-chip .lbl-name { font-size: 11px; color: var(--muted2); margin-top: 1px; }

.divider { height: 1px; background: var(--border); margin: 20px 0; }

/* ── Top Scorers ── */
.scorers-section { margin-top: 20px; margin-bottom: 0; }
.scorers-header { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.scorers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scorers-team { background: var(--surface2); border-radius: 8px; padding: 12px 14px; }
.scorers-team-name { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted2); margin-bottom: 8px; }
.scorer-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border); }
.scorer-row:last-child { border-bottom: none; padding-bottom: 0; }
.scorer-name { font-size: 13px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.scorer-stats { display: flex; gap: 8px; flex-shrink: 0; }
.scorer-stat { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted2); }
.scorer-stat span { color: var(--accent); font-weight: 600; }
@media (max-width: 520px) { .scorers-grid { grid-template-columns: 1fr; } }
.scorers-unavailable { font-size: 12px; color: var(--muted); font-style: italic; padding: 4px 0 8px; }

.analysis-text { font-size: 15px; line-height: 1.8; color: var(--text); white-space: pre-wrap; }
.analysis-text.streaming::after { content: '▋'; color: var(--accent); animation: blink 0.65s step-start infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ── States ── */
.loading-row { display: flex; align-items: center; gap: 10px; color: var(--muted2); font-size: 13px; padding: 24px 0; }
.spinner { width: 16px; height: 16px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

.error-box { background: rgba(232,80,74,0.09); border: 1px solid rgba(232,80,74,0.25); border-radius: 8px; padding: 12px 16px; font-size: 13px; color: var(--red); margin: 8px 0; }
.empty-state { text-align: center; padding: 64px 20px; color: var(--muted); }
.empty-state .icon { font-size: 44px; margin-bottom: 14px; }
.empty-state p { font-size: 14px; }

/* ── Storylines ── */
.storylines-wrap { margin-top: 36px; margin-bottom: 48px; }
.btn-storylines { background: rgba(78,203,113,0.1); border: 1px solid rgba(78,203,113,0.3); color: var(--green); border-radius: 8px; padding: 7px 16px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; letter-spacing: 0.3px; }
.btn-storylines:hover { background: rgba(78,203,113,0.2); border-color: var(--green); }
.btn-storylines:disabled { opacity: 0.4; cursor: not-allowed; }
.storylines-panel { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--green); border-radius: var(--r); padding: 24px 28px; margin-top: 14px; animation: appear 0.25s ease; }
.storylines-main { font-size: 15px; line-height: 1.8; color: var(--text); margin-bottom: 22px; }
.storylines-secondaries { border-top: 1px solid var(--border); }
.storyline-item { border-bottom: 1px solid var(--border); }
.storyline-toggle { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted2); transition: color 0.15s; user-select: none; gap: 12px; }
.storyline-toggle:hover { color: var(--text); }
.storyline-item.open .storyline-toggle { color: var(--green); }
.storyline-chevron { font-size: 9px; flex-shrink: 0; transition: transform 0.2s; display: inline-block; }
.storyline-item.open .storyline-chevron { transform: rotate(90deg); }
.storyline-body { font-size: 14px; line-height: 1.75; color: var(--muted2); padding-bottom: 14px; display: none; }
.storyline-item.open .storyline-body { display: block; }

/* ── Diagonal Score Split ── */
.score-split { position: relative; border-radius: 10px; overflow: hidden; width: 100%; background: var(--surface2); }
.split-bg-left { position: absolute; inset: 0; clip-path: polygon(0 0, 55% 0, 45% 100%, 0 100%); }
.split-bg-right { position: absolute; inset: 0; clip-path: polygon(55% 0, 100% 0, 100% 100%, 45% 100%); }
.split-content { position: relative; z-index: 1; display: flex; align-items: center; padding: 12px 20px; gap: 10px; }
.sbar-left { flex: 1; display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.sbar-right { flex: 1; display: flex; align-items: center; gap: 10px; }
.sbar-abbr { font-weight: 700; font-size: 14px; color: var(--muted2); font-family: 'DM Mono', monospace; }
.sbar-score { font-family: 'Bebas Neue', sans-serif; font-size: 46px; color: var(--accent); line-height: 1; }
.sbar-status { flex-shrink: 0; font-size: 11px; font-weight: 600; color: var(--muted2); font-family: 'DM Mono', monospace; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; white-space: nowrap; }
.sbar-arrow { color: var(--accent); font-size: 10px; flex-shrink: 0; }

/* ── Tab Bar ── */
.tab-bar { display: flex; gap: 8px; margin-bottom: 28px; }
.tab-btn { flex: 1; height: 42px; border: 1px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.18s; background: transparent; color: var(--muted); letter-spacing: 0.3px; }
.tab-btn:hover:not(.active) { color: var(--text); border-color: var(--border2); }
.tab-btn[data-tab="games"].active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.tab-btn[data-tab="storylines"].active { background: rgba(78,203,113,0.12); border-color: rgba(78,203,113,0.45); color: var(--green); }
.tab-pane { }

/* ── My Team Select ── */
select { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 9px 13px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px; outline: none; transition: border-color 0.2s; color-scheme: dark; cursor: pointer; }
select:focus { border-color: var(--accent); }

/* ── Team Storylines ── */
.team-storylines-wrap { margin-top: 36px; margin-bottom: 48px; }
.btn-team-storylines { border-radius: 8px; padding: 7px 16px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: opacity 0.15s; letter-spacing: 0.3px; border-style: solid; border-width: 1px; }
.btn-team-storylines:hover { opacity: 0.8; }
.btn-team-storylines:disabled { opacity: 0.4; cursor: not-allowed; }
.team-storylines-panel { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--r); padding: 24px 28px; margin-top: 14px; animation: appear 0.25s ease; }

/* ── Prediction Chip ── */
.prediction-chip { background: rgba(167,139,250,0.08); border: 1px solid rgba(167,139,250,0.2); border-radius: 8px; padding: 8px 14px; margin: 0 auto 20px; display: flex; width: fit-content; align-items: center; gap: 8px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--purple); }
.pred-pill { font-size: 8px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--purple); background: rgba(167,139,250,0.15); border-radius: 4px; padding: 2px 7px; flex-shrink: 0; }

@media (max-width: 600px) {
  .scoreboard { font-size: 20px; min-width: 58px; }
  .score-summary { gap: 8px; }
  .score-chip { padding: 10px 12px; }
  .analysis-panel { padding: 20px; }
  .sbar-score { font-size: 34px; }
  .split-content { padding: 10px 14px; gap: 8px; }
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo-mark">🏀</div>
    <div class="logo-text">
      <h1>NBA <em>INTEL</em></h1>
      <p>AI-powered game summaries · Data by BallDontLie · Analysis by Claude · v1.41</p>
    </div>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="games" onclick="setTab('games')">Game Finder</button>
    <button class="tab-btn" data-tab="storylines" onclick="setTab('storylines')">Storylines</button>
    <button class="tab-btn" data-tab="team" onclick="setTab('team')">Home Court</button>
  </div>

  <div class="tab-pane" id="tab-games">
  <div class="controls">
    <div class="controls-title">Search Games</div>
    <div class="controls-row">
      <div class="seg-toggle" id="modeToggle">
        <button class="seg-tab active" data-mode="single" onclick="setMode('single')">Single Day</button>
        <button class="seg-tab" data-mode="range" onclick="setMode('range')">Date Range</button>
      </div>
      <div class="field" id="fieldSingle">
        <label>Date</label>
        <input type="date" id="singleDate" />
      </div>
      <div class="field" id="fieldStart" style="display:none">
        <label>Start Date</label>
        <input type="date" id="startDate" />
      </div>
      <div class="field" id="fieldEnd" style="display:none">
        <label>End Date <span style="font-size:10px;color:var(--muted)">(max 30 days)</span></label>
        <input type="date" id="endDate" />
      </div>
      <div>
        <label>Summary Length</label>
        <div class="seg-toggle" id="lengthToggle">
          <button class="seg-tab active" data-len="short" onclick="setLength('short')">Short</button>
          <button class="seg-tab" data-len="long" onclick="setLength('long')">Long</button>
        </div>
      </div>
      <button class="btn btn-ghost" onclick="setToday()">Today</button>
      <button class="btn btn-primary" id="searchBtn" onclick="fetchGames()">Search</button>
    </div>
  </div>

  <div class="analysis-panel" id="analysisPanel">
    <div class="analysis-head">
      <div class="analysis-head-left">
        <h2 id="analysisTitle">—</h2>
        <p id="analysisMeta">—</p>
      </div>
    </div>
    <div class="score-summary" id="scoreSummary"></div>
    <div id="predictionChip" class="prediction-chip" style="display:none"></div>
    <div class="scorers-section" id="scorersSection" style="display:none"></div>
    <div class="divider" id="analysisDivider" style="display:none"></div>
    <div class="analysis-text" id="analysisText"></div>
  </div>

  <div id="gamesWrap">
    <div class="empty-state">
      <div class="icon">🏀</div>
      <p>Pick a date above to load games</p>
    </div>
  </div>
  </div><!-- end tab-games -->

  <div class="tab-pane" id="tab-storylines" style="display:none">
    <div class="storylines-wrap" style="margin-top:8px">
      <div class="section-label">Storylines</div>
      <button class="btn-storylines" id="storylinesBtn" onclick="loadStorylines()">What's happening in the NBA right now?</button>
      <div class="storylines-panel" id="storylinesPanel" style="display:none">
        <div class="analysis-text" id="storylinesText"></div>
      </div>
    </div>
  </div>

  <div class="tab-pane" id="tab-team" style="display:none">
    <div class="controls" style="margin-bottom:20px">
      <div class="controls-title">My Team</div>
      <div class="controls-row">
        <div class="field" style="min-width:300px;max-width:320px">
          <label>Select Your Team</label>
          <select id="myTeamSelect" onchange="setMyTeam(this.value)">
            <option value="">No team selected</option>
            <option value="ATL">ATL · Atlanta Hawks</option>
            <option value="BOS">BOS · Boston Celtics</option>
            <option value="BKN">BKN · Brooklyn Nets</option>
            <option value="CHA">CHA · Charlotte Hornets</option>
            <option value="CHI">CHI · Chicago Bulls</option>
            <option value="CLE">CLE · Cleveland Cavaliers</option>
            <option value="DAL">DAL · Dallas Mavericks</option>
            <option value="DEN">DEN · Denver Nuggets</option>
            <option value="DET">DET · Detroit Pistons</option>
            <option value="GSW">GSW · Golden State Warriors</option>
            <option value="HOU">HOU · Houston Rockets</option>
            <option value="IND">IND · Indiana Pacers</option>
            <option value="LAC">LAC · LA Clippers</option>
            <option value="LAL">LAL · Los Angeles Lakers</option>
            <option value="MEM">MEM · Memphis Grizzlies</option>
            <option value="MIA">MIA · Miami Heat</option>
            <option value="MIL">MIL · Milwaukee Bucks</option>
            <option value="MIN">MIN · Minnesota Timberwolves</option>
            <option value="NOP">NOP · New Orleans Pelicans</option>
            <option value="NYK">NYK · New York Knicks</option>
            <option value="OKC">OKC · Oklahoma City Thunder</option>
            <option value="ORL">ORL · Orlando Magic</option>
            <option value="PHI">PHI · Philadelphia 76ers</option>
            <option value="PHX">PHX · Phoenix Suns</option>
            <option value="POR">POR · Portland Trail Blazers</option>
            <option value="SAC">SAC · Sacramento Kings</option>
            <option value="SAS">SAS · San Antonio Spurs</option>
            <option value="TOR">TOR · Toronto Raptors</option>
            <option value="UTA">UTA · Utah Jazz</option>
            <option value="WAS">WAS · Washington Wizards</option>
          </select>
        </div>
      </div>
    </div>
    <div id="teamPlaceholder" style="color:var(--muted);font-size:13px;padding:16px 0">Select a team above to see their storylines.</div>
    <div class="team-storylines-wrap" id="teamStorylinesWrap" style="display:none;margin-top:0">
      <div class="section-label" id="teamSectionLabel">Team Storylines</div>
      <button class="btn-team-storylines" id="teamStorylinesBtn" onclick="loadTeamStorylines()">—</button>
      <div class="team-storylines-panel" id="teamStorylinesPanel" style="display:none">
        <div class="storylines-main analysis-text" id="teamStorylinesText"></div>
      </div>
    </div>
  </div>

</div>
<script>
let mode         = 'single';
let summaryLen   = 'short';
let games        = [];
let activeGameId = null;
let myTeam       = null;
let currentLabel = '';

(function init() {
  const today = todayStr();
  document.getElementById('singleDate').value = today;
  document.getElementById('startDate').value  = today;
  document.getElementById('endDate').value    = today;
  fetchGames();
})();

function setMode(m) {
  mode = m;
  document.querySelectorAll('#modeToggle .seg-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.mode === m));
  document.getElementById('fieldSingle').style.display = m === 'single' ? '' : 'none';
  document.getElementById('fieldStart').style.display  = m === 'range'  ? '' : 'none';
  document.getElementById('fieldEnd').style.display    = m === 'range'  ? '' : 'none';
}

function setLength(len) {
  summaryLen = len;
  document.querySelectorAll('#lengthToggle .seg-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.len === len));
  if (activeGameId != null) analyzeGame(activeGameId);
}

function setToday() {
  const t = todayStr();
  document.getElementById('singleDate').value = t;
  document.getElementById('startDate').value  = t;
  document.getElementById('endDate').value    = t;
  setMode('single');
  fetchGames();
}

async function fetchGames() {
  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = 'Loading…';
  hideAnalysis();
  showLoading('gamesWrap', 'Fetching games…');

  let url, label;
  try {
    if (mode === 'single') {
      const date = document.getElementById('singleDate').value;
      if (!date) { alert('Select a date.'); return; }
      url   = `/api/games?date=${date}`;
      label = formatDate(date);
    } else {
      const start = document.getElementById('startDate').value;
      const end   = document.getElementById('endDate').value;
      if (!start || !end) { alert('Select start and end dates.'); return; }
      const diff = (new Date(end) - new Date(start)) / 86400000;
      if (diff < 0)  { showError('gamesWrap', 'End date must be after start date.'); return; }
      if (diff > 30) { showError('gamesWrap', 'Date range cannot exceed 30 days.'); return; }
      url   = `/api/games?start_date=${start}&end_date=${end}`;
      label = `${formatDate(start)} – ${formatDate(end)}`;
    }

    const res  = await fetch(url);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);

    games = data.data || [];
    renderGames(games, label);
  } catch (e) {
    showError('gamesWrap', `Failed to load games: ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Search';
  }
}

function renderGames(list, label) {
  currentLabel = label;
  const wrap = document.getElementById('gamesWrap');
  if (!list.length) {
    wrap.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>No games found for ${label}</p></div>`;
    return;
  }

  list.sort((a, b) => {
    const da = new Date(a.date), db = new Date(b.date);
    if (da - db !== 0) return da - db;
    if (myTeam) {
      const aIs = a.home_team.abbreviation === myTeam.abbreviation || a.visitor_team.abbreviation === myTeam.abbreviation;
      const bIs = b.home_team.abbreviation === myTeam.abbreviation || b.visitor_team.abbreviation === myTeam.abbreviation;
      if (aIs && !bIs) return -1;
      if (!aIs && bIs) return 1;
    }
    const rank = s => s === 'Final' || s === 'Final/OT' ? 2 : s?.includes('Qtr') ? 0 : 1;
    return rank(a.status) - rank(b.status);
  });

  wrap.innerHTML = `
    <div class="section-label">${list.length} game${list.length !== 1 ? 's' : ''} · ${label}</div>
    <div class="games-list" id="gamesList"></div>`;

  const gl = document.getElementById('gamesList');
  list.forEach(g => gl.appendChild(buildCard(g)));
}

function buildCard(g) {
  const card = document.createElement('div');
  card.className = 'game-card';
  card.id = `card-${g.id}`;

  const { badgeCls, badgeLabel, detail } = statusInfo(g);
  const hs = g.home_team_score ?? '–';
  const vs = g.visitor_team_score ?? '–';
  const showDate = mode === 'range';

  let playoffBadges = '';
  if (g.postseason) {
    if (g.playoff_round_name) playoffBadges += `<span class="badge-round">${g.playoff_round_name}</span>`;
    if (g.playoff_game_number != null) {
      playoffBadges += `<span class="badge-playoff">🏆 Game ${g.playoff_game_number}</span>`;
    }
  }

  let seriesLabel = '';
  if (g.postseason && g.series_over) {
    const hw = g.series_home_wins ?? 0;
    const vw = g.series_visitor_wins ?? 0;
    const winner = hw > vw ? g.home_team.abbreviation : g.visitor_team.abbreviation;
    seriesLabel = `${winner} wins ${Math.max(hw,vw)}–${Math.min(hw,vw)}`;
  } else if (g.postseason && g.series_games_played > 0) {
    const hw = g.series_home_wins ?? 0;
    const vw = g.series_visitor_wins ?? 0;
    if (hw === vw) {
      seriesLabel = `Series tied ${hw}–${vw}`;
    } else {
      const leader = hw > vw ? g.home_team.abbreviation : g.visitor_team.abbreviation;
      seriesLabel  = `${leader} leads ${Math.max(hw,vw)}–${Math.min(hw,vw)}`;
    }
  } else if (g.postseason && g.playoff_game_number === 1) {
    seriesLabel = 'Series tied 0–0';
  }

  // Seed labels — only shown for playoff games when seed data is available
  const vSeed = g.postseason && g.visitor_seed != null ? `<div class="team-seed">#${g.visitor_seed}</div>` : '';
  const hSeed = g.postseason && g.home_seed    != null ? `<div class="team-seed">#${g.home_seed}</div>`   : '';

  card.innerHTML = `
    <div class="teams">
      <div class="team">
        <div class="team-abbr">${g.visitor_team.abbreviation}</div>
        ${vSeed}
      </div>
      <div class="scoreboard">
        <span>${vs}</span><span class="score-dot">·</span><span>${hs}</span>
      </div>
      <div class="team home">
        <div class="team-abbr">${g.home_team.abbreviation}</div>
        ${hSeed}
      </div>
    </div>
    <div class="game-info">
      <div class="badges">
        ${playoffBadges}
        <span class="badge ${badgeCls}">${badgeLabel}</span>
      </div>
      <span class="game-date-label">
        ${showDate ? shortDate(g.date) + ' · ' : ''}${seriesLabel || detail}
      </span>
    </div>
    <button class="analyze-btn" onclick="analyzeGame(${g.id})">Analyze ✦</button>`;

  return card;
}

function renderScorers(topScorers, game) {
  const el      = document.getElementById('scorersSection');
  const divider = document.getElementById('analysisDivider');
  const hasScoreChips = game.home_team_score != null && game.visitor_team_score != null;

  // No stats at all (game not started)
  if (!topScorers && !hasScoreChips) {
    el.style.display = 'none';
    return;
  }

  // Stats were fetched but empty or unavailable (live game lag)
  if (!topScorers || topScorers.pending || (!topScorers.home.length && !topScorers.visitor.length)) {
    el.innerHTML = `
      <div class="scorers-header">Top Scorers</div>
      <div class="scorers-unavailable">Player stats not yet available — try again in a few minutes once BallDontLie finishes processing the box score.</div>`;
    el.style.display = '';
    if (divider) divider.style.display = '';
    return;
  }

  const sv = parseInt(game.visitor_team_score, 10);
  const sh = parseInt(game.home_team_score, 10);
  const vWins = !isNaN(sv) && !isNaN(sh) && sv > sh;
  const hWins = !isNaN(sv) && !isNaN(sh) && sh > sv;

  const teamCol = (players, teamName, isWinner) => {
    if (!players || !players.length) return '';
    const brd = isWinner ? 'var(--accent)' : 'var(--border)';
    const rows = players.map((p, i) => `
      <div class="scorer-row">
        <div class="scorer-name">${i === 0 ? '⭐ ' : ''}${p.name}</div>
        <div class="scorer-stats">
          <div class="scorer-stat"><span>${p.pts}</span> pts</div>
          <div class="scorer-stat"><span>${p.reb}</span> reb</div>
          <div class="scorer-stat"><span>${p.ast}</span> ast</div>
        </div>
      </div>`).join('');
    return `<div class="scorers-team" style="border:1px solid ${brd}"><div class="scorers-team-name">${teamName}</div>${rows}</div>`;
  };

  const visitorCol = teamCol(topScorers.visitor, game.visitor_team.full_name, vWins);
  const homeCol    = teamCol(topScorers.home,    game.home_team.full_name,    hWins);

  el.innerHTML = `
    <div class="scorers-header">Top Scorers</div>
    <div class="scorers-grid">${visitorCol}${homeCol}</div>`;
  el.style.display = '';
  if (divider) divider.style.display = '';
}

async function analyzeGame(gameId) {
  const game = games.find(g => g.id === gameId);
  if (!game) return;

  document.querySelectorAll('.game-card').forEach(c => c.classList.remove('active'));
  document.getElementById(`card-${gameId}`)?.classList.add('active');
  activeGameId = gameId;

  const panel  = document.getElementById('analysisPanel');
  const title  = document.getElementById('analysisTitle');
  const meta   = document.getElementById('analysisMeta');
  const scores = document.getElementById('scoreSummary');
  const divid  = document.getElementById('analysisDivider');
  const text   = document.getElementById('analysisText');

  const hasScores = game.home_team_score != null && game.visitor_team_score != null;
  document.getElementById('predictionChip').style.display = 'none';
  if (hasScores) {
    const gs = game.status || '';
    const sbarStatus = (gs === 'Final' || gs === 'Final/OT') ? gs
      : (gs.includes('Qtr') || gs === 'Halftime') ? gs
      : gs === 'In Progress' ? 'LIVE'
      : fmtGameTime(gs);
    const vScore = parseInt(game.visitor_team_score, 10);
    const hScore = parseInt(game.home_team_score, 10);
    const vLeads = !isNaN(vScore) && !isNaN(hScore) && vScore > hScore;
    const hLeads = !isNaN(vScore) && !isNaN(hScore) && hScore > vScore;
    const vBg = hexToRgba(TEAM_COLORS[game.visitor_team.abbreviation] || '#1f1f30', 0.35);
    const hBg = hexToRgba(TEAM_COLORS[game.home_team.abbreviation] || '#1f1f30', 0.35);
    scores.innerHTML = `
      <div class="score-split">
        <div class="split-bg-left" style="background:${vBg}"></div>
        <div class="split-bg-right" style="background:${hBg}"></div>
        <div class="split-content">
          <div class="sbar-left">
            <span class="sbar-abbr">${game.visitor_team.abbreviation}</span>
            <span class="sbar-score">${game.visitor_team_score}</span>
          </div>
          <span class="sbar-arrow" style="${vLeads ? '' : 'visibility:hidden'}">◀</span>
          <div class="sbar-status">${sbarStatus}</div>
          <span class="sbar-arrow" style="${hLeads ? '' : 'visibility:hidden'}">▶</span>
          <div class="sbar-right">
            <span class="sbar-score">${game.home_team_score}</span>
            <span class="sbar-abbr">${game.home_team.abbreviation}</span>
          </div>
        </div>
      </div>`;
    divid.style.display = '';
  } else {
    scores.innerHTML = '';
    divid.style.display = 'none';
  }
  // Always show divider above analysis text (will be set after scorers render)

  let gameTitle = `${game.visitor_team.full_name} @ ${game.home_team.full_name}`;
  if (game.postseason) {
    const parts = [];
    if (game.playoff_round_name)   parts.push(game.playoff_round_name);
    if (game.playoff_game_number != null) parts.push(`Game ${game.playoff_game_number}`);
    if (parts.length) gameTitle += ` — ${parts.join(', ')}`;
  }

  // Render top scorers
  renderScorers(game.top_scorers || null, game);

  title.textContent = gameTitle;
  meta.textContent  = `${formatDate(game.date)} · Generating ${summaryLen} analysis…`;
  text.textContent  = '';
  text.classList.add('streaming');
  panel.classList.add('show');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ game, length: summaryLen }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `Error ${res.status}`);
    }

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (raw === '[DONE]') continue;
        try {
          const p = JSON.parse(raw);
          if (p.type === 'content_block_delta' && p.delta?.text) {
            text.textContent += p.delta.text;
          }
        } catch { /* skip */ }
      }
    }

    text.classList.remove('streaming');
    // Extract prediction line if present (pre-game analysis only)
    {
      const fullText = text.textContent;
      const predMatch = fullText.match(/\nPREDICTION:\s*(.+)/i);
      if (predMatch) {
        text.textContent = fullText.replace(/\n?PREDICTION:\s*.+/i, '').trim();
        const chip = document.getElementById('predictionChip');
        chip.innerHTML = `<span class="pred-pill">AI Prediction</span>${predMatch[1].trim()}`;
        chip.style.display = 'flex';
      }
    }
    const ctxParts = [formatDate(game.date)];
    if (game.postseason) {
      if (game.playoff_round_name)  ctxParts.push(game.playoff_round_name);
      if (game.playoff_game_number != null) ctxParts.push(`Game ${game.playoff_game_number}`);
    } else {
      ctxParts.push('Regular Season');
    }
    ctxParts.push(summaryLen === 'short' ? 'Short summary' : 'Full analysis');
    meta.textContent = ctxParts.join(' · ');

  } catch (e) {
    text.classList.remove('streaming');
    text.textContent = '';
    scores.innerHTML = '';
    divid.style.display = 'none';
    panel.insertAdjacentHTML('beforeend', `<div class="error-box">Analysis failed: ${e.message}</div>`);
  }
}

function hideAnalysis() {
  document.getElementById('analysisPanel').classList.remove('show');
  document.getElementById('scorersSection').style.display = 'none';
  document.getElementById('predictionChip').style.display = 'none';
  document.querySelectorAll('.game-card').forEach(c => c.classList.remove('active'));
  activeGameId = null;
}

function fmtGameTime(s) {
  if (!s) return 'Scheduled';
  // ISO timestamp like "2026-05-23T00:30:00Z"
  if (s.includes('T') && (s.endsWith('Z') || s.includes('+'))) {
    try {
      const d = new Date(s);
      if (!isNaN(d)) {
        return d.toLocaleTimeString('en-US', {
          timeZone: 'America/New_York',
          hour: 'numeric', minute: '2-digit', hour12: true,
        }) + ' ET';
      }
    } catch {}
  }
  return s;
}

function statusInfo(g) {
  const s = g.status || '';
  if (s === 'Final' || s === 'Final/OT') return { badgeCls: 'badge-final', badgeLabel: s, detail: '' };
  // BDL returns live status as e.g. "1st Qtr", "2nd Qtr", "Halftime", "4th Qtr 2:34", "In Progress"
  if (s.includes('Qtr') || s === 'In Progress' || s === 'Halftime') {
    // Use the status string itself as the badge label (it's already human-readable)
    const liveLabel = s === 'In Progress' ? 'Live' : s;
    return { badgeCls: 'badge-live', badgeLabel: liveLabel, detail: '' };
  }
  // Scheduled — status may be ISO timestamp or pre-formatted time string
  return { badgeCls: 'badge-soon', badgeLabel: fmtGameTime(s), detail: '' };
}

function todayStr() {
  // Use Eastern Time (ET) — NBA games are scheduled in ET
  return new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
}

function formatDate(d) {
  if (!d) return '';
  const dateStr = typeof d === 'string' && d.includes('T') ? d.split('T')[0] : d;
  return new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function shortDate(d) {
  return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function parseStorylines(raw) {
  const mainMatch = raw.match(/^MAIN\s*\n([\s\S]+?)(?=\nSIDE:|$)/m);
  const sideMatches = [...raw.matchAll(/\nSIDE:\s*([^\n]+)\n([\s\S]+?)(?=\nSIDE:|$)/g)];
  return {
    main:  mainMatch ? mainMatch[1].trim() : raw.trim(),
    sides: sideMatches.map(m => ({ title: m[1].trim(), body: m[2].trim() })),
  };
}

function renderStorylines(parsed) {
  const panel = document.getElementById('storylinesPanel');
  panel.innerHTML = '';

  const mainEl = document.createElement('div');
  mainEl.className = 'storylines-main';
  mainEl.textContent = parsed.main;
  panel.appendChild(mainEl);

  if (!parsed.sides.length) return;

  const secEl = document.createElement('div');
  secEl.className = 'storylines-secondaries';

  parsed.sides.forEach((side, i) => {
    const item = document.createElement('div');
    item.className = 'storyline-item';

    const toggle = document.createElement('div');
    toggle.className = 'storyline-toggle';
    toggle.onclick = () => item.classList.toggle('open');

    const titleSpan = document.createElement('span');
    titleSpan.textContent = side.title;
    const chevron = document.createElement('span');
    chevron.className = 'storyline-chevron';
    chevron.textContent = '▶';

    toggle.appendChild(titleSpan);
    toggle.appendChild(chevron);

    const body = document.createElement('div');
    body.className = 'storyline-body';
    body.textContent = side.body;

    item.appendChild(toggle);
    item.appendChild(body);
    secEl.appendChild(item);
  });

  panel.appendChild(secEl);
}

async function loadStorylines() {
  const btn   = document.getElementById('storylinesBtn');
  const panel = document.getElementById('storylinesPanel');

  btn.disabled    = true;
  btn.textContent = 'Loading…';
  panel.style.display = '';
  panel.innerHTML = '<div class="loading-row"><div class="spinner"></div><span>Generating storylines…</span></div>';

  try {
    const res = await fetch('/api/storylines', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({}),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `Error ${res.status}`);
    }

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (raw === '[DONE]') continue;
        try {
          const p = JSON.parse(raw);
          if (p.type === 'content_block_delta' && p.delta?.text) fullText += p.delta.text;
        } catch { /* skip */ }
      }
    }

    renderStorylines(parseStorylines(fullText));
    btn.textContent = '↺ Refresh';
  } catch (e) {
    panel.innerHTML = `<div class="error-box">Failed to load storylines: ${e.message}</div>`;
    btn.textContent = 'Retry';
  } finally {
    btn.disabled = false;
  }
}

const TEAM_NAMES = {
  ATL:'Atlanta Hawks', BOS:'Boston Celtics', BKN:'Brooklyn Nets',
  CHA:'Charlotte Hornets', CHI:'Chicago Bulls', CLE:'Cleveland Cavaliers',
  DAL:'Dallas Mavericks', DEN:'Denver Nuggets', DET:'Detroit Pistons',
  GSW:'Golden State Warriors', HOU:'Houston Rockets', IND:'Indiana Pacers',
  LAC:'LA Clippers', LAL:'Los Angeles Lakers', MEM:'Memphis Grizzlies',
  MIA:'Miami Heat', MIL:'Milwaukee Bucks', MIN:'Minnesota Timberwolves',
  NOP:'New Orleans Pelicans', NYK:'New York Knicks', OKC:'Oklahoma City Thunder',
  ORL:'Orlando Magic', PHI:'Philadelphia 76ers', PHX:'Phoenix Suns',
  POR:'Portland Trail Blazers', SAC:'Sacramento Kings', SAS:'San Antonio Spurs',
  TOR:'Toronto Raptors', UTA:'Utah Jazz', WAS:'Washington Wizards',
};
const TEAM_COLORS = {
  ATL:'#E03A3E', BOS:'#007A33', BKN:'#777777', CHA:'#00788C',
  CHI:'#CE1141', CLE:'#860038', DAL:'#00538C', DEN:'#FEC524',
  DET:'#C8102E', GSW:'#1D428A', HOU:'#CE1141', IND:'#FDBB30',
  LAC:'#C8102E', LAL:'#552583', MEM:'#5D76A9', MIA:'#98002E',
  MIL:'#00471B', MIN:'#236192', NOP:'#B4975A', NYK:'#F58426',
  OKC:'#007AC1', ORL:'#0077C0', PHI:'#006BB6', PHX:'#E56020',
  POR:'#E03A3E', SAC:'#5A2D81', SAS:'#8A8D8F', TOR:'#CE1141',
  UTA:'#F9A01B', WAS:'#E31837',
};
function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;
}
function brightColor(hex) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0, s = 0;
  const l = (max + min) / 2;
  if (d) {
    s = d / (1 - Math.abs(2 * l - 1));
    if (max === r) h = ((g - b) / d + 6) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h /= 6;
  }
  const ts = s > 0.15 ? Math.max(s, 0.75) : s;
  return `hsl(${Math.round(h * 360)},${Math.round(ts * 100)}%,70%)`;
}

function setTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-pane').forEach(p => p.style.display = p.id === `tab-${tab}` ? '' : 'none');
}

function updateTeamTabStyle() {
  const btn = document.querySelector('.tab-btn[data-tab="team"]');
  if (!btn) return;
  if (myTeam) {
    const color = TEAM_COLORS[myTeam.abbreviation] || '#f5a623';
    btn.style.background   = hexToRgba(color, 0.15);
    btn.style.borderColor  = hexToRgba(color, 0.5);
    btn.style.color        = brightColor(color);
  } else {
    btn.style.background  = '';
    btn.style.borderColor = '';
    btn.style.color       = '';
  }
}

function setMyTeam(abbr) {
  const wrap = document.getElementById('teamStorylinesWrap');
  if (!abbr) {
    myTeam = null;
    wrap.style.display = 'none';
    document.getElementById('teamPlaceholder').style.display = '';
    updateTeamTabStyle();
    if (games.length) renderGames([...games], currentLabel);
    return;
  }
  myTeam = { abbreviation: abbr, full_name: TEAM_NAMES[abbr] || abbr };
  const color = TEAM_COLORS[abbr] || '#f5a623';
  document.getElementById('teamPlaceholder').style.display = 'none';

  const btn = document.getElementById('teamStorylinesBtn');
  btn.textContent = `What's happening with the ${myTeam.full_name}?`;
  btn.style.background = hexToRgba(color, 0.2);
  btn.style.border     = `1px solid ${hexToRgba(color, 0.6)}`;
  btn.style.color      = brightColor(color);

  const panel = document.getElementById('teamStorylinesPanel');
  panel.style.borderLeftColor = color;
  panel.style.display = 'none';
  document.getElementById('teamStorylinesText').textContent = '';

  wrap.style.display = '';
  updateTeamTabStyle();
  if (games.length) renderGames([...games], currentLabel);
}

async function loadTeamStorylines() {
  if (!myTeam) return;
  const btn   = document.getElementById('teamStorylinesBtn');
  const panel = document.getElementById('teamStorylinesPanel');
  const text  = document.getElementById('teamStorylinesText');
  const color = TEAM_COLORS[myTeam.abbreviation] || '#f5a623';

  btn.disabled    = true;
  btn.textContent = 'Loading…';
  btn.style.color = brightColor(color);
  panel.style.display = '';
  text.textContent    = '';
  text.classList.add('streaming');

  try {
    const res = await fetch('/api/team-storylines', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ team: myTeam }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `Error ${res.status}`);
    }
    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (raw === '[DONE]') continue;
        try {
          const p = JSON.parse(raw);
          if (p.type === 'content_block_delta' && p.delta?.text) text.textContent += p.delta.text;
        } catch { /* skip */ }
      }
    }
    text.classList.remove('streaming');
    btn.textContent = '↺ Refresh';
  } catch (e) {
    text.classList.remove('streaming');
    panel.innerHTML = `<div class="error-box">Failed to load team storylines: ${e.message}</div>`;
    btn.textContent = 'Retry';
  } finally {
    btn.disabled    = false;
    btn.style.color = brightColor(color);
  }
}

function showLoading(id, msg) {
  document.getElementById(id).innerHTML = `<div class="loading-row"><div class="spinner"></div><span>${msg}</span></div>`;
}

function showError(id, msg) {
  document.getElementById(id).innerHTML = `<div class="error-box">${msg}</div>`;
}
</script>
